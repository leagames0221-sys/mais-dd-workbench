name: drift-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: internal knowledge base 5 file 存在 check (doctrine: handoff-duty)
        run: |
          set -e
          for f in productContext activeContext decisionLog systemPatterns logbook; do
            test -f "(internal config)/internal_kb/${f}.md" || { echo "missing internal_kb/${f}.md"; exit 1; }
          done

      - name: Tier 2 CLAUDE.md 存在 check
        run: test -f CLAUDE.md

      - name: README literal file ref 実在 check
        run: |
          set -e
          test -f requirements-week0.txt
          test -f docs/discovery_brief.md
          test -f .github/dependabot.yml

      - name: internal ADR cross-repo citation marker check
        run: |
          grep -r "mais-deal-matching" CLAUDE.md README.md (internal config)/internal_kb/ docs/ || { echo "internal ADR inherit citation missing"; exit 1; }

      - name: PII boundary check (operational に PII field 名 literal 出現禁止)
        run: |
          set -e
          # src/pipeline + src/operational + src/citation で PII field 名 literal 出現禁止
          # (src/ingestion = doc parsing で field 名遭遇可、 src/redaction = redact 関数で必要、 src/vault = vault 内必要)
          ! grep -rE "(name_full|email|phone|address_full|raw_self_intro|raw_description|name_kana|dob_exact|contact_email|contact_phone|contact_person|raw_text)" src/pipeline/ src/operational/ src/citation/ 2>/dev/null || { echo "PII field 名 literal in disallowed module"; exit 1; }

      - name: Install Week 4 active deps (T1 commit a34d27f 同 pattern fix、 doctrine: analogical-recall 順守)
        # Week 4 stack (fastapi + uvicorn + jinja2 + cryptography 含、 Week 0-2 全継承)
        # install しないと src/api/app.py 経由の future test collection 失敗 risk。
        run: |
          pip install -r requirements-week4.txt

      - name: Run pytest (fast only, slow integration tests deselected)
        run: |
          if [ -d tests ] && find tests -name "test_*.py" | grep -q .; then
            pytest -m "not slow" tests/
          else
            echo "no tests yet (scaffold phase)"
          fi
